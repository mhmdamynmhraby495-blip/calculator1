<!DOCTYPE html>
<html lang="en">

<body>
  <!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ماشین حساب</title>
<link rel="stylesheet" href="java.css">
</head>

<body>
>
    <center>

عدد اول:
<input type="text" id="txt1">
<br><br>
عدد دوم:
<input type="text" id="txt2">
<br><br>
نتیجه:
<input type="text" id="txt3">
<br><br>

<button onclick="add()">+</button>
<button onclick="sub()">-</button>
<button onclick="mul()">*</button>
<button onclick="divi()">/</button>
<button onclick="avg()">avg</button>

<script>
function add() {
    let a = Number(document.getElementById("txt1").value);
    let b = Number(document.getElementById("txt2").value);
    document.getElementById("txt3").value = a + b;
}

function sub() {
    let a = Number(document.getElementById("txt1").value);
    let b = Number(document.getElementById("txt2").value);
    document.getElementById("txt3").value = a - b;
}

function mul() {
    let a = Number(document.getElementById("txt1").value);
    let b = Number(document.getElementById("txt2").value);
    document.getElementById("txt3").value = a * b;
}

function divi() {
    let a = Number(document.getElementById("txt1").value);
    let b = Number(document.getElementById("txt2").value);
    document.getElementById("txt3").value = a / b;
}

function avg() {
    let a = Number(document.getElementById("txt1").value);
    let b = Number(document.getElementById("txt2").value);
    document.getElementById("txt3").value = (a + b) / 2;
}
</script>
</body>
</html>
